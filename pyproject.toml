[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sixg-mr-nwm"
version = "0.1.0"
description = "Reproducible multi-rate world-model research for intent-aware RAN control"
requires-python = ">=3.10"
dependencies = ["torch>=2.1,<3", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<0.12"]
paper = ["matplotlib>=3.7,<4"]
foundation = ["transformers>=4.46,<5", "safetensors>=0.4,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
